<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky-nav-scroll</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="nav">
        <strong>Atlas</strong>
        <nav>
            <a href="#about">About</a>
            <a href="#places">Places</a>
        </nav>
    </header>
    <section class="hero">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Karst_peaks_and_green_paddy_fields_under_a_stormy_sky,_South_view_from_Mount_Nam_Xay,_Vang_Vieng,_Laos.jpg?width=3840" alt="Karst peaks and green paddy fields near Vang Vieng, Laos" loading="lazy">
        <h1>Wander Further</h1>
    </section>
    <section id="about" class="block">
        <h2>About</h2>
        <p>Atlas is a small guide to quite beautiful places</p>
    </section>
    <section id="places" class="block">
        <h2>Places</h2>
        <p>Loas,Cambodia,Belize and more</p>
    </section>
    <button aria-label="Back to the top" class="top show" id="top">&#8593</button>
</body>
</html>
